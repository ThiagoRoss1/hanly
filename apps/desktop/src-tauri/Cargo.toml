[package]
name = "hanly-desktop"
version = "1.1.0"
description = "Hanly native desktop application"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.3", features = ["tray-icon"] }

tauri-plugin-clipboard-manager = "=2.4.2"

[features]
custom-protocol = ["tauri/custom-protocol"]
