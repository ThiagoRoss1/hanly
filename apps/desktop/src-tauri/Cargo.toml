[package]
name = "hanly-desktop"
version = "1.1.0"
description = "Hanly native desktop application"
edition = "2021"
rust-version = "1.99"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.3", features = ["tray-icon"] }

tauri-plugin-clipboard-manager = "=2.4.2"
tauri-plugin-global-shortcut = "=2.4.1"
ctrlc = { version = "=3.5.2", features = ["termination"] }
libc = "0.2"
anyhow = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", features = ["NSWindow", "NSApplication", "NSScreen", "NSImage", "NSColor", "NSView", "NSRunningApplication", "NSWorkspace", "objc2-quartz-core"] }

objc2-foundation = { version = "=0.3.2", features = ["NSData", "NSProcessInfo"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "WKWebView", "WKSnapshotConfiguration", "objc2-app-kit", "objc2-core-foundation", "block2"] }
block2 = "=0.6.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
