[dependency-groups]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "numpy>=1.24",
    "packaging>=24.0",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pynput>=1.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100
include = ["packages/**/*.py", "tests/**/*.py", "tools/**/*.py", "spikes/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
files = ["packages", "tests", "tools", "spikes"]

[[tool.mypy.overrides]]
module = ["paddleocr.*", "kiwipiepy.*", "PIL.*", "mss.*", "PyQt6.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "skip"
