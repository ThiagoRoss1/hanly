[dependency-groups]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "numpy>=1.24",
    "packaging>=24.0",
    "Pillow>=10,<13",
    "pytest>=8.3",
    "pyyaml>=6.0",
    "ruff>=0.6",
    "types-pynput>=1.8",
    "types-PyYAML>=6.0",
    "zstandard>=0.23,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks/dev/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100
include = [
    "benchmarks/**/*.py",
    "packages/**/*.py",
    "packaging/**/*.py",
    "tests/**/*.py",
    "tools/**/*.py",
    "spikes/**/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
files = ["benchmarks", "packages", "packaging", "tests", "tools", "spikes"]

[[tool.mypy.overrides]]
module = [
    "easyocr.*",
    "torch.*",
    "kiwipiepy.*",
    "PIL.*",
    "mss.*",
    "PyQt6.*",
    "pystray.*",
    "webview.*",
    "psutil.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "skip"
