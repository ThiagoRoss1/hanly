[dependency-groups]
dev = [
    "build>=1.2",
    "certifi>=2024.2.2",
    "mypy>=1.11",
    "numpy>=1.24",
    "packaging>=24.0",
    "Pillow>=10,<13",
    "pytest>=8.3",
    "pyyaml>=6.0",
    "ruff>=0.6",
    "types-pynput>=1.8",
    "types-PyYAML>=6.0",
    "zstandard>=0.23,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks/dev/tests"]
pythonpath = ["."]
# Applied by the suite conftests from the directory a case lives in, so a
# report says which machine ran what. Selection itself is `--suite`, which
# excludes a suite before its modules are imported.
markers = [
    "native: runs real Qt, child-process, or OS-adapter behavior",
    "packaged: runs the frozen product rather than the checkout",
]

[tool.ruff]
target-version = "py310"
line-length = 100
include = [
    "benchmarks/**/*.py",
    "packages/**/*.py",
    "packaging/**/*.py",
    "tests/**/*.py",
    "tools/**/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
files = ["benchmarks", "packages", "packaging", "tests", "tools"]
# A suppression that stops being needed is noise that hides the next real
# one, and several had already gone dead unnoticed.
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "easyocr.*",
    "torch.*",
    "kiwipiepy.*",
    "PIL.*",
    "mss.*",
    "PyQt6.*",
    "pystray.*",
    "webview.*",
    "psutil.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "skip"
