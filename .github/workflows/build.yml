name: Build Desktop Artifacts

# Each job installs the full desktop runtime and freezes a multi-gigabyte
# onedir package, so artifact production is deliberate rather than automatic.
# Correctness on every push stays with the ci.yml Python matrix.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # One entry per platform. Declaring `platform` and `runner` under
        # `include` alongside a separate matrix vector would collapse every
        # entry into a single job instead of expanding to three.
        include:
          - platform: windows
            runner: windows-latest
            python-version: "3.10"
          - platform: macos
            runner: macos-latest
            python-version: "3.10"
          - platform: linux
            runner: ubuntu-latest
            python-version: "3.10"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # PyInstaller inspects PyQt6.QtWidgets during Linux collection. The
      # Ubuntu hosted image does not include the loader that owns libEGL.so.1.
      # Xvfb is the display the frozen window gate runs in; a hosted Linux
      # runner has no session of its own.
      - name: Install Linux packaging dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 xvfb

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev

      - name: Install CPU-only OCR runtime on Linux
        if: matrix.platform == 'linux'
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install packages
        run: |
          python -m pip install --editable packages/hanly
          python -m pip install --editable "packages/hanly-app[runtime]"

      # A tag push is the release identity, so the tag and the product
      # version must agree before any artifact is produced under that name.
      - name: Verify the tag matches the product version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/release_version.py --tag "$RELEASE_TAG"

      - name: Install packaging tool
        run: python -m pip install "pyinstaller>=6,<7"

      - name: Run tests
        run: python -m pytest

      - name: Run lint
        run: python -m ruff check packages packaging tests tools benchmarks

      - name: Run type checks
        run: python -m mypy packages packaging tests tools benchmarks

      - name: Build application package
        run: python tools/build_package.py --platform ${{ matrix.platform }}

      - name: Check the frozen bundle inventory
        run: >
          python tools/smoke_packaged_runtime.py
          dist/${{ matrix.platform }}/hanly-desktop --inventory-only

      - name: Smoke the frozen lookup runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/reports
          python tools/smoke_packaged_runtime.py \
            "dist/${{ matrix.platform }}/hanly-desktop" \
            --image tests/hanly_fixtures/assets/korean_reading_roi.png \
            --timeout 2400 \
            | tee "dist/reports/hanly-smoke-${{ matrix.platform }}.json"

      - name: Smoke the frozen Control Center
        continue-on-error: ${{ matrix.platform != 'windows' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/reports
          display=""
          if [ "${{ matrix.platform }}" = "linux" ]; then display="xvfb-run -a"; fi
          $display python tools/smoke_packaged_runtime.py \
            "dist/${{ matrix.platform }}/hanly-desktop" \
            --window-only \
            | tee "dist/reports/hanly-window-${{ matrix.platform }}.json"

      - name: Verify the release archive exists
        shell: bash
        run: |
          set -euo pipefail
          archive=""
          for candidate in "dist/hanly-desktop-${{ matrix.platform }}".{zip,tar.gz}; do
            if [ -f "$candidate" ]; then archive="$candidate"; fi
          done
          test -n "$archive" || { echo "no release archive for ${{ matrix.platform }}" >&2; exit 1; }
          archive_size="$(wc -c < "$archive")"
          max_release_asset_bytes=2147483648
          test "$archive_size" -lt "$max_release_asset_bytes" || {
            echo "release archive exceeds GitHub's per-asset size limit: $archive_size bytes" >&2
            exit 1
          }
          echo "release archive: $archive ($archive_size bytes)"

      - name: Record the artifact identity
        shell: bash
        env:
          RUNNER_PLATFORM: ${{ matrix.platform }}
          RUNNER_OS_NAME: ${{ runner.os }}
          RUNNER_ARCHITECTURE: ${{ runner.arch }}
        run: |
          set -euo pipefail
          mkdir -p dist/reports
          archive=""
          for candidate in "dist/hanly-desktop-${RUNNER_PLATFORM}".{zip,tar.gz}; do
            if [ -f "$candidate" ]; then archive="$candidate"; fi
          done
          python - "$archive" > "dist/reports/hanly-artifact-${RUNNER_PLATFORM}.json" <<'PY'
          import hashlib, json, os, platform, sys

          path = sys.argv[1]
          digest = hashlib.sha256()
          with open(path, "rb") as stream:
              for chunk in iter(lambda: stream.read(1 << 20), b""):
                  digest.update(chunk)
          json.dump(
              {
                  "platform": os.environ["RUNNER_PLATFORM"],
                  "runner_os": os.environ["RUNNER_OS_NAME"],
                  "runner_arch": os.environ["RUNNER_ARCHITECTURE"],
                  "os_version": platform.platform(),
                  "machine": platform.machine(),
                  "python": platform.python_version(),
                  "archive": os.path.basename(path),
                  "archive_bytes": os.path.getsize(path),
                  "archive_sha256": digest.hexdigest(),
              },
              sys.stdout,
              indent=2,
          )
          PY

      # Only the archive is retained. The uncompressed onedir tree beside it is
      # the same payload again, and PyInstaller's work cache is not releasable.
      - name: Retain platform artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hanly-desktop-${{ matrix.platform }}
          path: |
            dist/hanly-desktop-${{ matrix.platform }}.zip
            dist/hanly-desktop-${{ matrix.platform }}.tar.gz
            dist/reports/hanly-smoke-${{ matrix.platform }}.json
            dist/reports/hanly-window-${{ matrix.platform }}.json
            dist/reports/hanly-artifact-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 14
