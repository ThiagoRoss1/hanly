name: Build Desktop Artifacts

# Freezing a multi-gigabyte onedir package is deliberate, never automatic.
# Correctness on every push stays with the ci.yml matrix.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # A matrix vector declared beside `include` would collapse these
        # three entries into a single job.
        include:
          - platform: windows
            runner: windows-latest
            python-version: "3.10"
          - platform: macos
            runner: macos-latest
            python-version: "3.10"
          - platform: linux
            runner: ubuntu-latest
            python-version: "3.10"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Written before the first install, so a run that dies later still names
      # the machine it died on.
      - name: Record the host fingerprint
        shell: bash
        run: >
          python tools/native_host_fingerprint.py
          --context "before install"
          --output "dist/reports/hanly-host-${{ matrix.platform }}.json"

      - name: Install Linux packaging dependencies
        if: matrix.platform == 'linux'
        run: |
          packages=(
            libegl1 libgl1 libfontconfig1 libx11-xcb1
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-shm0
            libxcb-sync1 libxcb-util1 libxcb-xfixes0 libxcb-xkb1
            libxkbcommon-x11-0 xvfb
          )
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends "${packages[@]}"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev -c packaging/release-constraints.txt

      - name: Install CPU-only OCR runtime on Linux
        if: matrix.platform == 'linux'
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install packages
        run: |
          python -m pip install --editable packages/hanly
          python -m pip install --editable "packages/hanly-app[runtime]" -c packaging/release-constraints.txt

      # In a child of its own: importing Torch is one of the things that ends
      # a packaging run outright.
      - name: Record what the installed runtime reports
        shell: bash
        run: >
          python tools/native_host_fingerprint.py
          --context "installed runtime"
          --with-torch
          --output "dist/reports/hanly-host-runtime-${{ matrix.platform }}.json"

      # What every product of this run has to report for itself afterwards: a
      # bundle that cannot name its source is not release evidence.
      - name: Resolve the product version this build must carry
        shell: bash
        run: echo "SOURCE_VERSION=$(python tools/release_version.py)" >> "$GITHUB_ENV"

      # The tag is the release identity, so it must agree with the product
      # version before any artifact is produced under that name.
      - name: Verify the tag matches the product version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/release_version.py --tag "$RELEASE_TAG"

      - name: Install packaging tool
        run: >
          python -m pip install "pyinstaller>=6,<7" pyinstaller-hooks-contrib
          -c packaging/release-constraints.txt

      - name: Prepare the bundled EasyOCR weights
        run: python tools/prepare_easyocr_models.py

      # The delta is diffed against the previous *published* manifest, never a
      # rebuilt tag: a rebuild is a different tree, and a delta whose base
      # nobody has installed applies to nothing. A release without one is
      # normal - the first manifest-aware build has no predecessor - so this
      # step never fails the build.
      - name: Fetch the previous published Windows manifest
        id: base
        if: matrix.platform == 'windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          mkdir -p release-base
          for asset in hanly-desktop-windows.manifest.json SHA256SUMS; do
            gh release download --repo "$REPOSITORY" --pattern "$asset"               --dir release-base --clobber || true
          done
          if [[ -f release-base/hanly-desktop-windows.manifest.json && -f release-base/SHA256SUMS ]]
          then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "no previous published manifest; this release publishes no delta"
          fi

      - name: Build application package
        id: build
        shell: bash
        env:
          PYINSTALLER_STRICT_BUNDLE_CODESIGN_ERROR: "1"
          RUNNER_PLATFORM: ${{ matrix.platform }}
          BASE_AVAILABLE: ${{ steps.base.outputs.available }}
        run: |
          set -euo pipefail
          arguments=(--platform "$RUNNER_PLATFORM")
          if [[ "$RUNNER_PLATFORM" == "windows" && "$BASE_AVAILABLE" == "true" ]]; then
            arguments+=(
              --base-manifest release-base/hanly-desktop-windows.manifest.json
              --base-checksums release-base/SHA256SUMS
            )
          fi
          python tools/build_package.py "${arguments[@]}"

      # Every check below states the product it actually needs, so one failed
      # smoke cannot skip the rest and leave a red run with no evidence.
      - name: Resolve the frozen application to smoke
        id: resolve
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        env:
          RUNNER_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p dist/reports
          if [ "$RUNNER_PLATFORM" = "macos" ]; then
            python tools/smoke_packaged_runtime.py \
              --from-archive dist/hanly-desktop-macos.zip \
              --reconstruct-into dist/reconstructed \
              --reconstruct-only \
              | tee "dist/reports/hanly-products-macos.json"
            echo "SMOKE_APP=dist/reconstructed/Hanly.app" >> "$GITHUB_ENV"
          else
            echo "SMOKE_APP=dist/$RUNNER_PLATFORM/hanly-desktop" >> "$GITHUB_ENV"
          fi

      # Its own published product: a ZIP that will not reconstruct says
      # nothing about the disk image beside it.
      - name: Inspect the published disk image
        id: disk_image
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.platform == 'macos' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/reports
          python tools/smoke_packaged_runtime.py \
            --disk-image dist/hanly-desktop-macos.dmg \
            | tee "dist/reports/hanly-diskimage-macos.json"

      - name: Check the frozen bundle inventory
        id: inventory
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/reports
          python tools/smoke_packaged_runtime.py "$SMOKE_APP" --inventory-only \
            | tee "dist/reports/hanly-inventory-${{ matrix.platform }}.json"

      - name: Build the dictionary the frozen smoke installs
        id: dictionary
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: python tools/build_smoke_krdict.py "$RUNNER_TEMP/hanly-smoke-krdict/krdict.sqlite3"

      # Captured to files rather than piped: evidence that lives only in the
      # step log cannot be uploaded when the harness dies before reporting.
      - name: Smoke the frozen lookup runtime
        id: worker_smoke
        if: >-
          ${{ !cancelled() && steps.resolve.outcome == 'success'
          && steps.dictionary.outcome == 'success' }}
        shell: bash
        env:
          RUNNER_PLATFORM: ${{ matrix.platform }}
        run: |
          set -uo pipefail
          mkdir -p dist/reports
          report="dist/reports/hanly-smoke-$RUNNER_PLATFORM"
          status=0
          python tools/smoke_packaged_runtime.py \
            "$SMOKE_APP" \
            --image tests/hanly_fixtures/assets/korean_reading_roi.png \
            --krdict "$RUNNER_TEMP/hanly-smoke-krdict/krdict.sqlite3" \
            --expect-version "$SOURCE_VERSION" \
            > "$report.json" 2> "$report.err" || status=$?
          cat "$report.json"
          tail -c 200000 "$report.err" >&2
          exit "$status"

      - name: Smoke the frozen Control Center
        id: ui_smoke
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        shell: bash
        env:
          RUNNER_PLATFORM: ${{ matrix.platform }}
        run: |
          set -uo pipefail
          mkdir -p dist/reports
          display=""
          if [ "$RUNNER_PLATFORM" = "linux" ]; then display="xvfb-run -a"; fi
          report="dist/reports/hanly-window-$RUNNER_PLATFORM"
          status=0
          $display python tools/smoke_packaged_runtime.py \
            "$SMOKE_APP" \
            --window-only \
            > "$report.json" 2> "$report.err" || status=$?
          cat "$report.json"
          tail -c 200000 "$report.err" >&2
          exit "$status"

      # Nothing here may skip: the artifact it needs is the one being produced.
      - name: Run the packaged tests
        id: packaged_tests
        if: >-
          ${{ !cancelled() && steps.resolve.outcome == 'success'
          && steps.dictionary.outcome == 'success' }}
        shell: bash
        env:
          RUNNER_PLATFORM: ${{ matrix.platform }}
          HANLY_REQUIRE_PACKAGED: "1"
        run: |
          set -euo pipefail
          display=""
          if [ "$RUNNER_PLATFORM" = "linux" ]; then display="xvfb-run -a"; fi
          # Read as a shell variable rather than through the workflow env
          # context: the resolve step wrote it via $GITHUB_ENV, where no
          # static check of this file can see it declared.
          export HANLY_PACKAGED_APP="$SMOKE_APP"
          $display python -m pytest --suite packaged

      - name: Verify the release archive exists
        id: archives
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        env:
          RUNNER_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          case "$RUNNER_PLATFORM" in
            windows) products=(dist/hanly-desktop-windows.zip) ;;
            macos) products=(dist/hanly-desktop-macos.zip dist/hanly-desktop-macos.dmg) ;;
            linux) products=(dist/hanly-desktop-linux.tar.gz) ;;
            *) echo "unsupported platform $RUNNER_PLATFORM" >&2; exit 1 ;;
          esac
          max_release_asset_bytes=2147483648
          for archive in "${products[@]}"; do
            test -f "$archive" || { echo "no release archive at $archive" >&2; exit 1; }
            archive_size="$(wc -c < "$archive")"
            test "$archive_size" -lt "$max_release_asset_bytes" || {
              echo "release archive exceeds GitHub's per-asset size limit: $archive_size bytes" >&2
              exit 1
            }
            echo "release archive: $archive ($archive_size bytes)"
          done

      - name: Record the artifact identity
        id: identity
        if: ${{ !cancelled() && steps.archives.outcome == 'success' }}
        shell: bash
        env:
          RUNNER_PLATFORM: ${{ matrix.platform }}
          RUNNER_OS_NAME: ${{ runner.os }}
          RUNNER_ARCHITECTURE: ${{ runner.arch }}
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist/reports
          case "$RUNNER_PLATFORM" in
            windows) products=(dist/hanly-desktop-windows.zip) ;;
            macos) products=(dist/hanly-desktop-macos.zip dist/hanly-desktop-macos.dmg) ;;
            linux) products=(dist/hanly-desktop-linux.tar.gz) ;;
            *) echo "unsupported platform $RUNNER_PLATFORM" >&2; exit 1 ;;
          esac
          python - "${products[@]}" > "dist/reports/hanly-artifact-${RUNNER_PLATFORM}.json" <<'PY'
          import hashlib, json, os, platform, sys

          def described(path):
              digest = hashlib.sha256()
              with open(path, "rb") as stream:
                  for chunk in iter(lambda: stream.read(1 << 20), b""):
                      digest.update(chunk)
              return {
                  "archive": os.path.basename(path),
                  "archive_bytes": os.path.getsize(path),
                  "archive_sha256": digest.hexdigest(),
              }

          json.dump(
              {
                  "platform": os.environ["RUNNER_PLATFORM"],
                  # An archive hash says two downloads are the same file. Only
                  # these say which source the file was made from.
                  "build_commit": os.environ["BUILD_COMMIT"],
                  "source_version": os.environ["SOURCE_VERSION"],
                  "runner_os": os.environ["RUNNER_OS_NAME"],
                  "runner_arch": os.environ["RUNNER_ARCHITECTURE"],
                  "os_version": platform.platform(),
                  "machine": platform.machine(),
                  "python": platform.python_version(),
                  "archives": [described(path) for path in sys.argv[1:]],
              },
              sys.stdout,
              indent=2,
          )
          PY

      # Never a release product: what a failed run leaves behind has to
      # survive the failure that produced it.
      - name: Retain build diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hanly-diagnostics-${{ matrix.platform }}
          path: |
            dist/reports/
            dist/.pyinstaller/${{ matrix.platform }}/**/warn-*.txt
            dist/.pyinstaller/${{ matrix.platform }}/**/xref-*.html
          if-no-files-found: ignore
          retention-days: 14

      # Only the archive: the onedir tree beside it is the same payload again,
      # and PyInstaller's work cache is not releasable.
      - name: Retain platform artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hanly-desktop-${{ matrix.platform }}
          path: |
            dist/hanly-desktop-${{ matrix.platform }}.zip
            dist/hanly-desktop-${{ matrix.platform }}.dmg
            dist/hanly-desktop-${{ matrix.platform }}.tar.gz
            dist/hanly-desktop-windows.manifest.json
            dist/hanly-desktop-windows.update.json
            dist/hanly-desktop-windows-from-*.delta.zip
            dist/reports/hanly-smoke-${{ matrix.platform }}.json
            dist/reports/hanly-window-${{ matrix.platform }}.json
            dist/reports/hanly-artifact-${{ matrix.platform }}.json
            dist/reports/hanly-products-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 14
