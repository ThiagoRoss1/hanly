name: Release Hanly Desktop

# Publication stays a deliberate dispatch. The independently versioned KRDICT
# resource is produced by build-krdict-resource.yml and selected by its run id;
# the application build is found from the tag rather than a copied run id.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (for example v0.1.0)"
        required: true
        type: string
      resource_run_id:
        description: "Successful build-krdict-resource run id"
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: Publish release assets
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RESOURCE_RUN_ID: ${{ inputs.resource_run_id }}
    steps:
      - name: Check out release tooling
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable packages/hanly
          python -m pip install --editable packages/hanly-app

      - name: Verify the tag matches the product version
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "tag must be vMAJOR.MINOR.PATCH" >&2
            exit 1
          }
          [[ "$RESOURCE_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "resource_run_id must be a decimal run id" >&2
            exit 1
          }
          python tools/release_version.py --tag "$RELEASE_TAG"

      # The build workflow runs on the tag itself, so selecting its run by tag
      # ties the published binaries to the commit that tag names without asking
      # a human to copy a run id that could point anywhere.
      - name: Resolve the application build for this tag
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --workflow build.yml --branch "$RELEASE_TAG" \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          test -n "$run_id" || {
            echo "no successful build run found for tag $RELEASE_TAG" >&2
            exit 1
          }
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - name: Download per-platform application artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.build.outputs.run_id }}
          pattern: hanly-desktop-*
          path: release-inputs/app
          merge-multiple: false

      - name: Download resource artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.RESOURCE_RUN_ID }}
          name: hanly-krdict-resource
          path: release-inputs/resources
          merge-multiple: false

      - name: Validate and stage the producer resource manifest
        id: manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-output

          find_resource() {
            local pattern="$1"
            mapfile -t matches < <(find release-inputs/resources -type f -name "$pattern" -print | sort)
            ((${#matches[@]} == 1)) || {
              echo "expected exactly one resource artifact matching $pattern; found ${#matches[@]}" >&2
              printf '  %s\n' "${matches[@]}" >&2
              return 1
            }
            printf '%s' "${matches[0]}"
          }

          krdict="$(find_resource 'krdict-*.sqlite3.zst')"
          producer_manifest="$(find_resource '*.resource.json')"
          cp "$producer_manifest" release-output/hanly-resources.json

          python - "$krdict" release-output/hanly-resources.json <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import sys

          from hanly_app.update_service import RemoteManifest, RemoteManifestError

          artifact = pathlib.Path(sys.argv[1])
          payload = json.loads(pathlib.Path(sys.argv[2]).read_text(encoding="utf-8"))
          assert isinstance(payload, dict)
          assert set(payload) == {"manifest_version", "resources"}
          assert type(payload["manifest_version"]) is int
          assert payload["manifest_version"] == 1
          resources = payload["resources"]
          assert isinstance(resources, dict) and set(resources) == {"krdict"}
          resource = resources["krdict"]
          assert isinstance(resource, dict)
          expected_fields = {
              "asset_name",
              "checksum",
              "expected_entry_count",
              "kind",
              "schema_version",
              "size",
              "source_date",
              "version",
          }
          assert set(resource) == expected_fields
          assert "url" not in resource
          assert isinstance(resource["asset_name"], str)
          assert isinstance(resource["checksum"], str)
          assert isinstance(resource["kind"], str)
          assert resource["kind"] == "krdict"
          assert isinstance(resource["version"], str)
          assert re.fullmatch(r"[A-Za-z0-9._-]+", resource["version"])
          assert resource["asset_name"] == f"krdict-{resource['version']}.sqlite3.zst"
          assert re.fullmatch(r"krdict-[A-Za-z0-9._-]+\.sqlite3\.zst", resource["asset_name"])
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", resource["checksum"])
          assert type(resource["schema_version"]) is int and resource["schema_version"] == 1
          assert type(resource["expected_entry_count"]) is int
          assert resource["expected_entry_count"] > 0
          assert type(resource["size"]) is int and resource["size"] > 0
          assert isinstance(resource["source_date"], str)
          assert re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}", resource["source_date"])
          try:
              parsed = RemoteManifest.from_payload(payload)
          except (RemoteManifestError, ValueError) as exc:
              raise AssertionError(f"producer manifest is not consumable: {exc}") from exc
          assert len(tuple(parsed)) == 1
          digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
          assert resource["asset_name"] == artifact.name
          assert resource["checksum"] == f"sha256:{digest}"
          assert resource["size"] == artifact.stat().st_size
          assert resource["kind"] == "krdict"
          for field in ("version", "schema_version", "expected_entry_count", "source_date"):
              assert resource[field]
          PY

          mapfile -t app_assets < <(find release-inputs/app -type f \( -name 'hanly-desktop-*.zip' -o -name 'hanly-desktop-*.tar.gz' \) -print | sort)
          ((${#app_assets[@]} > 0)) || { echo 'missing hanly-desktop application archives' >&2; exit 1; }
          resource_assets=("$krdict")

          # Checksums are recorded under the published asset names so a
          # consumer can verify downloaded files directly, not under the
          # staging paths the artifacts happen to land in here.
          for asset in "${app_assets[@]}" "${resource_assets[@]}" release-output/hanly-resources.json; do
            ( cd "$(dirname "$asset")" && sha256sum "$(basename "$asset")" )
          done > release-output/SHA256SUMS

          printf '%s\n' "${app_assets[@]}" > release-output/application-assets.txt
          printf '%s\n' "${resource_assets[@]}" > release-output/resource-assets.txt

      - name: Create GitHub release and attach artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          # gh would otherwise create a missing tag at the default branch head,
          # publishing binaries under a ref that was never built or reviewed.
          gh api "repos/${{ github.repository }}/git/ref/tags/$RELEASE_TAG" >/dev/null \
            || { echo "release tag $RELEASE_TAG does not exist" >&2; exit 1; }

          mapfile -t app_assets < release-output/application-assets.txt
          mapfile -t resource_assets < release-output/resource-assets.txt
          gh release create "$RELEASE_TAG" \
            "${app_assets[@]}" \
            "${resource_assets[@]}" \
            release-output/hanly-resources.json \
            release-output/SHA256SUMS \
            --title "Hanly Desktop $RELEASE_TAG" \
            --generate-notes
