name: Release Hanly Desktop

on:
  workflow_run:
    workflows: ["Build Desktop Artifacts"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (for example v0.1.0)"
        required: true
        type: string
      validate_only:
        description: "Validate an existing draft and write nothing at all"
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || inputs.tag }}
  cancel-in-progress: false

jobs:
  stage:
    name: Stage draft release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      noop: ${{ steps.preflight.outputs.action == 'noop' }}
      head_sha: ${{ steps.application.outputs.head_sha }}
      run_id: ${{ steps.application.outputs.run_id }}
    env:
      REPOSITORY: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RELEASE_EVENT: ${{ github.event_name }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || inputs.tag }}
      WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
      VALIDATE_ONLY: ${{ inputs.validate_only }}
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install trusted release dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --editable packages/hanly --editable packages/hanly-app

      - name: Resolve application build for exact tag
        id: application
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$VALIDATE_ONLY" != "" && "$VALIDATE_ONLY" != "true" && "$VALIDATE_ONLY" != "false" ]]; then
            echo "validate_only must be boolean" >&2
            exit 1
          fi
          if [[ "$RELEASE_EVENT" != "workflow_dispatch" && "$VALIDATE_ONLY" == "true" ]]; then
            echo "validate_only is manual-only" >&2
            exit 1
          fi

          resolve_arguments=(resolve --repository "$REPOSITORY" --tag "$RELEASE_TAG")
          if [[ "$RELEASE_EVENT" == "workflow_run" ]]; then
            [[ "$WORKFLOW_RUN_HEAD_BRANCH" == "$RELEASE_TAG" ]] || {
              echo "release tag does not match workflow_run.head_branch" >&2
              exit 1
            }
            resolve_arguments+=(--run-id "$WORKFLOW_RUN_ID")
          fi

          resolved="$RUNNER_TEMP/application-build"
          python tools/release_build.py "${resolve_arguments[@]}" > "$resolved"
          head_sha="$(sed -n 's/^head_sha=//p' "$resolved")"

          if [[ "$RELEASE_EVENT" == "workflow_run" ]]; then
            [[ "$WORKFLOW_RUN_HEAD_SHA" == "$head_sha" ]] || {
              echo "tag commit does not equal workflow_run.head_sha" >&2
              exit 1
            }
          fi
          cat "$resolved" >> "$GITHUB_OUTPUT"

      - name: Verify tagged product version
        env:
          GH_TOKEN: ${{ github.token }}
          APPLICATION_HEAD_SHA: ${{ steps.application.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          tagged_metadata="$(mktemp -d)"
          for path in packages/hanly-app/pyproject.toml packages/hanly/pyproject.toml; do
            mkdir -p "$tagged_metadata/$(dirname "$path")"
            gh api \
              -H "Accept: application/vnd.github.raw" \
              "repos/$REPOSITORY/contents/$path?ref=$APPLICATION_HEAD_SHA" \
              > "$tagged_metadata/$path"
          done

          read -r TAGGED_APP_VERSION TAGGED_ENGINE_VERSION APP_HANLY_PIN APP_HANLY_CONCRETE_PIN < <(
            python tools/tagged_metadata.py "$tagged_metadata"
          )
          python tools/release_version.py \
            --tag "$RELEASE_TAG" \
            --engine-version "$TAGGED_ENGINE_VERSION" \
            --app-version "$TAGGED_APP_VERSION" \
            --app-hanly-pin "$APP_HANLY_PIN" \
            --app-hanly-concrete-pin "$APP_HANLY_CONCRETE_PIN"

      - name: Classify any release that already holds the tag
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          APPLICATION_HEAD_SHA: ${{ steps.application.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          classified="$RUNNER_TEMP/release-classification"
          python tools/release_build.py classify \
            --repository "$REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --commit "$APPLICATION_HEAD_SHA" \
            --event "$RELEASE_EVENT" > "$classified"
          cat "$classified" >> "$GITHUB_OUTPUT"

          action="$(sed -n 's/^action=//p' "$classified")"
          if [[ "$VALIDATE_ONLY" == "true" && "$action" != "reuse" ]]; then
            echo "validate_only needs an existing draft staged for this commit; got $action" >&2
            exit 1
          fi

      - name: Download per-platform application artifacts
        if: steps.preflight.outputs.action != 'noop' && inputs.validate_only != true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.application.outputs.run_id }}
          pattern: hanly-desktop-*
          path: release-inputs/app
          merge-multiple: false

      - name: Validate application assets
        if: steps.preflight.outputs.action != 'noop' && inputs.validate_only != true
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t symlinks < <(find release-inputs/app -type l -print)
          ((${#symlinks[@]} == 0)) || {
            echo "symlink application assets are not allowed" >&2
            exit 1
          }
          mapfile -t all_archives < <(find release-inputs/app -type f -print | sort)
          if [[ ${#all_archives[@]} -ne 3 ]]; then
            echo "expected exactly three application archives; duplicate, unexpected, or missing files" >&2
            exit 1
          fi
          expected_archives=(
            hanly-desktop-windows.zip
            hanly-desktop-macos.tar.gz
            hanly-desktop-linux.tar.gz
          )
          max_release_asset_bytes=2147483648
          mkdir -p release-output
          for expected in "${expected_archives[@]}"; do
            mapfile -t matches < <(find release-inputs/app -type f -name "$expected" -print)
            ((${#matches[@]} == 1)) || {
              echo "expected exactly one $expected; duplicate or missing files" >&2
              exit 1
            }
            archive_size="$(wc -c < "${matches[0]}")"
            test "$archive_size" -lt "$max_release_asset_bytes" || {
              echo "$expected exceeds GitHub's per-asset size limit: $archive_size bytes" >&2
              exit 1
            }
            cp "${matches[0]}" "release-output/$expected"
          done

      - name: Carry the previous release resource into a new draft
        id: carried
        if: steps.preflight.outputs.action == 'create' && inputs.validate_only != true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          previous_tag="$(
            gh release list --repo "$REPOSITORY" --exclude-drafts \
              --exclude-pre-releases --limit 1 --json tagName \
              --jq '.[0].tagName // empty'
          )"
          if [[ -z "$previous_tag" ]]; then
            echo "no previous public release; the draft waits for the first KRDICT upload"
            printf 'carried=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$previous_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "latest public release has no semver tag" >&2
            exit 1
          }

          gh release download "$previous_tag" --pattern hanly-resources.json \
            --dir release-output --clobber
          asset_name="$(jq -r '.resources.krdict.asset_name // empty' release-output/hanly-resources.json)"
          [[ "$asset_name" =~ ^krdict-[A-Za-z0-9._-]+\.sqlite3\.zst$ ]] || {
            echo "previous manifest has no canonical KRDICT asset_name" >&2
            exit 1
          }
          gh release download "$previous_tag" --pattern "$asset_name" \
            --dir release-output --clobber
          printf 'carried=true\n' >> "$GITHUB_OUTPUT"
          printf 'asset_name=%s\n' "$asset_name" >> "$GITHUB_OUTPUT"
          printf '%s\n' "## Carried resource" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- reused $asset_name from $previous_tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Create or repair the draft release
        if: steps.preflight.outputs.action != 'noop' && inputs.validate_only != true
        env:
          GH_TOKEN: ${{ github.token }}
          APPLICATION_HEAD_SHA: ${{ steps.application.outputs.head_sha }}
          PREFLIGHT_ACTION: ${{ steps.preflight.outputs.action }}
          CARRIED: ${{ steps.carried.outputs.carried }}
          CARRIED_ASSET_NAME: ${{ steps.carried.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail

          notes="$RUNNER_TEMP/draft-notes.md"
          {
            printf '%s\n\n' "Hanly Desktop $RELEASE_TAG"
            printf '%s %s\n\n' "Hanly-Release-Commit:" "$APPLICATION_HEAD_SHA"
            printf '%s\n' "Attach the locally built KRDICT pair to this draft before approving"
            printf '%s\n' "the release: exactly one krdict-*.sqlite3.zst and one hanly-resources.json."
            printf '\n%s\n' "Keep the Hanly-Release-Commit line above: finalization uses it to prove"
            printf '%s\n' "this draft is the one staged for this commit, and refuses the draft without it."
          } > "$notes"

          if [[ "$PREFLIGHT_ACTION" == "create" ]]; then
            gh release create "$RELEASE_TAG" \
              --draft \
              --verify-tag \
              --title "Hanly Desktop $RELEASE_TAG" \
              --notes-file "$notes"
          fi

          upload=(
            release-output/hanly-desktop-windows.zip
            release-output/hanly-desktop-macos.tar.gz
            release-output/hanly-desktop-linux.tar.gz
          )
          for asset in "${upload[@]}"; do
            [[ -f "$asset" ]] || {
              echo "refusing to stage a draft without the three application archives" >&2
              exit 1
            }
          done
          if [[ "$PREFLIGHT_ACTION" == "create" && "$CARRIED" == "true" ]]; then
            upload+=(
              release-output/hanly-resources.json
              "release-output/$CARRIED_ASSET_NAME"
            )
          fi
          gh release upload "$RELEASE_TAG" "${upload[@]}" --clobber

          printf '%s\n' "## Draft staged" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- $RELEASE_TAG draft holds the application archives for $APPLICATION_HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$CARRIED" != "true" ]]; then
            printf '%s\n' "- attach the KRDICT pair before approving the finalize job" >> "$GITHUB_STEP_SUMMARY"
          fi

  finalize:
    name: Publish approved release
    needs: stage
    if: needs.stage.outputs.noop != 'true'
    runs-on: ubuntu-latest
    # Approval gate. Nothing in this job runs until a required reviewer approves
    # the deployment; publication is the last step, after every check passes.
    environment: hanly-release
    env:
      REPOSITORY: ${{ github.repository }}
      RELEASE_EVENT: ${{ github.event_name }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || inputs.tag }}
      WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
      VALIDATE_ONLY: ${{ inputs.validate_only }}
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install trusted release dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --editable packages/hanly --editable packages/hanly-app

      - name: Re-resolve the tag and its application build
        id: application
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$VALIDATE_ONLY" != "" && "$VALIDATE_ONLY" != "true" && "$VALIDATE_ONLY" != "false" ]]; then
            echo "validate_only must be boolean" >&2
            exit 1
          fi
          if [[ "$RELEASE_EVENT" != "workflow_dispatch" && "$VALIDATE_ONLY" == "true" ]]; then
            echo "validate_only is manual-only" >&2
            exit 1
          fi

          resolve_arguments=(resolve --repository "$REPOSITORY" --tag "$RELEASE_TAG")
          if [[ "$RELEASE_EVENT" == "workflow_run" ]]; then
            resolve_arguments+=(--run-id "$WORKFLOW_RUN_ID")
          fi
          python tools/release_build.py "${resolve_arguments[@]}" >> "$GITHUB_OUTPUT"

      - name: Verify tagged product version
        env:
          GH_TOKEN: ${{ github.token }}
          APPLICATION_HEAD_SHA: ${{ steps.application.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          tagged_metadata="$(mktemp -d)"
          for path in packages/hanly-app/pyproject.toml packages/hanly/pyproject.toml; do
            mkdir -p "$tagged_metadata/$(dirname "$path")"
            gh api \
              -H "Accept: application/vnd.github.raw" \
              "repos/$REPOSITORY/contents/$path?ref=$APPLICATION_HEAD_SHA" \
              > "$tagged_metadata/$path"
          done

          read -r TAGGED_APP_VERSION TAGGED_ENGINE_VERSION APP_HANLY_PIN APP_HANLY_CONCRETE_PIN < <(
            python tools/tagged_metadata.py "$tagged_metadata"
          )
          python tools/release_version.py \
            --tag "$RELEASE_TAG" \
            --engine-version "$TAGGED_ENGINE_VERSION" \
            --app-version "$TAGGED_APP_VERSION" \
            --app-hanly-pin "$APP_HANLY_PIN" \
            --app-hanly-concrete-pin "$APP_HANLY_CONCRETE_PIN"

      - name: Confirm the draft was staged for this commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          APPLICATION_HEAD_SHA: ${{ steps.application.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          classified="$RUNNER_TEMP/final-release-classification"
          python tools/release_build.py classify \
            --repository "$REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --commit "$APPLICATION_HEAD_SHA" \
            --event "$RELEASE_EVENT" > "$classified"
          cat "$classified"
          cat "$classified" >> "$GITHUB_OUTPUT"

          action="$(sed -n 's/^action=//p' "$classified")"
          [[ "$action" == "reuse" ]] || {
            echo "expected a staged draft for $RELEASE_TAG at $APPLICATION_HEAD_SHA; got $action" >&2
            exit 1
          }

      - name: Download per-platform application artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.application.outputs.run_id }}
          pattern: hanly-desktop-*
          path: release-inputs/app
          merge-multiple: false

      - name: Validate application assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t symlinks < <(find release-inputs/app -type l -print)
          ((${#symlinks[@]} == 0)) || {
            echo "symlink application assets are not allowed" >&2
            exit 1
          }
          mapfile -t all_archives < <(find release-inputs/app -type f -print | sort)
          if [[ ${#all_archives[@]} -ne 3 ]]; then
            echo "expected exactly three application archives; duplicate, unexpected, or missing files" >&2
            exit 1
          fi
          expected_archives=(
            hanly-desktop-windows.zip
            hanly-desktop-macos.tar.gz
            hanly-desktop-linux.tar.gz
          )
          max_release_asset_bytes=2147483648
          mkdir -p release-output
          for expected in "${expected_archives[@]}"; do
            mapfile -t matches < <(find release-inputs/app -type f -name "$expected" -print)
            ((${#matches[@]} == 1)) || {
              echo "expected exactly one $expected; duplicate or missing files" >&2
              exit 1
            }
            archive_size="$(wc -c < "${matches[0]}")"
            test "$archive_size" -lt "$max_release_asset_bytes" || {
              echo "$expected exceeds GitHub's per-asset size limit: $archive_size bytes" >&2
              exit 1
            }
            cp "${matches[0]}" "release-output/$expected"
          done

      - name: Take the KRDICT pair from the draft
        id: resources
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-inputs/resources release-inputs/previous release-output

          mapfile -t draft_assets < <(
            gh api "repos/$REPOSITORY/releases/$RELEASE_ID" --jq '.assets[].name' | sort
          )
          mapfile -t resource_assets < <(printf '%s\n' "${draft_assets[@]}" | grep -E '^krdict-[A-Za-z0-9._-]+\.sqlite3\.zst$' || true)
          ((${#resource_assets[@]} == 1)) || {
            echo "the draft must hold exactly one krdict-*.sqlite3.zst; found ${#resource_assets[@]}" >&2
            printf '  %s\n' "${draft_assets[@]}" >&2
            exit 1
          }
          resource_asset_name="${resource_assets[0]}"
          printf '%s\n' "${draft_assets[@]}" | grep -qx 'hanly-resources.json' || {
            echo "the draft has no hanly-resources.json; attach the manifest before approving" >&2
            exit 1
          }

          allowed=(
            hanly-desktop-windows.zip
            hanly-desktop-macos.tar.gz
            hanly-desktop-linux.tar.gz
            "$resource_asset_name"
            hanly-resources.json
            SHA256SUMS
          )
          for asset in "${draft_assets[@]}"; do
            printf '%s\n' "${allowed[@]}" | grep -qx -- "$asset" || {
              echo "the draft holds an unexpected asset: $asset" >&2
              exit 1
            }
          done

          gh release download "$RELEASE_TAG" --pattern "$resource_asset_name" \
            --dir release-inputs/resources --clobber
          gh release download "$RELEASE_TAG" --pattern hanly-resources.json \
            --dir release-inputs/resources --clobber

          previous_tag="$(
            gh release list --repo "$REPOSITORY" --exclude-drafts \
              --exclude-pre-releases --limit 1 --json tagName \
              --jq '.[0].tagName // empty'
          )"
          if [[ -n "$previous_tag" && "$previous_tag" != "$RELEASE_TAG" ]]; then
            gh release download "$previous_tag" --pattern hanly-resources.json \
              --dir release-inputs/previous --clobber
          fi
          printf 'asset_name=%s\n' "$resource_asset_name" >> "$GITHUB_OUTPUT"

      - name: Validate the resource pair and stage the final assets
        env:
          RESOURCE_ASSET_NAME: ${{ steps.resources.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          cp "release-inputs/resources/$RESOURCE_ASSET_NAME" "release-output/$RESOURCE_ASSET_NAME"
          cp release-inputs/resources/hanly-resources.json release-output/hanly-resources.json

          previous_manifest=""
          if [[ -f release-inputs/previous/hanly-resources.json ]]; then
            previous_manifest="release-inputs/previous/hanly-resources.json"
          fi
          python - "$RESOURCE_ASSET_NAME" release-output/hanly-resources.json "$previous_manifest" <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import sys

          from hanly_app.update_service import RemoteManifest, RemoteManifestError

          asset_name = sys.argv[1]
          manifest_path = pathlib.Path(sys.argv[2])
          previous_path = pathlib.Path(sys.argv[3]) if sys.argv[3] else None
          artifact = pathlib.Path("release-output") / asset_name

          def require(condition: bool, message: str) -> None:
              if not condition:
                  raise ValueError(message)

          def read_payload(path: pathlib.Path, label: str) -> dict:
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as error:
                  raise ValueError(f"{label} is not valid JSON: {error}") from error
              require(isinstance(payload, dict), f"{label} must be an object")
              return payload

          try:
              payload = read_payload(manifest_path, "manifest")
              require(set(payload) == {"manifest_version", "resources"}, "manifest keys are not canonical")
              require(type(payload["manifest_version"]) is int, "manifest_version must be an integer")
              require(payload["manifest_version"] == 1, "manifest_version must be 1")
              resources = payload["resources"]
              require(isinstance(resources, dict) and set(resources) == {"krdict"}, "resources must contain only krdict")
              resource = resources["krdict"]
              require(isinstance(resource, dict), "krdict resource must be an object")
              expected_fields = {
                  "asset_name", "checksum", "expected_entry_count", "kind",
                  "schema_version", "size", "source_date", "version",
              }
              require(set(resource) == expected_fields, "resource fields are not canonical")
              require("url" not in resource, "inline resource URLs are forbidden")
              require(isinstance(resource["asset_name"], str), "asset_name must be a string")
              require(isinstance(resource["checksum"], str), "checksum must be a string")
              require(isinstance(resource["kind"], str) and resource["kind"] == "krdict", "kind must be krdict")
              require(isinstance(resource["version"], str), "resource_version must be a string")
              resource_version = resource["version"]
              require(re.fullmatch(r"[A-Za-z0-9._-]+", resource_version) is not None, "resource_version has unsafe characters")
              require(resource["asset_name"] == f"krdict-{resource_version}.sqlite3.zst", "asset_name is not canonical")
              require(re.fullmatch(r"krdict-[A-Za-z0-9._-]+\.sqlite3\.zst", resource["asset_name"]) is not None, "asset_name is unsafe")
              require(re.fullmatch(r"sha256:[0-9a-f]{64}", resource["checksum"]) is not None, "checksum is not canonical")
              require(type(resource["schema_version"]) is int and resource["schema_version"] == 1, "schema_version must be 1")
              require(type(resource["expected_entry_count"]) is int and resource["expected_entry_count"] > 0, "expected_entry_count must be positive")
              require(type(resource["size"]) is int and resource["size"] > 0, "size must be positive")
              require(isinstance(resource["source_date"], str) and re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}", resource["source_date"]) is not None, "source_date must be YYYY-MM-DD")
              try:
                  parsed = RemoteManifest.from_payload(payload)
              except (RemoteManifestError, ValueError) as error:
                  raise ValueError(f"manifest is not consumable: {error}") from error
              require(len(tuple(parsed)) == 1, "manifest must contain exactly one resource")
              require(asset_name == resource["asset_name"], "artifact name does not match manifest")
              digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
              require(resource["checksum"] == f"sha256:{digest}", "artifact checksum does not match manifest")
              require(resource["size"] == artifact.stat().st_size, "artifact size does not match manifest")

              if previous_path is not None:
                  previous = read_payload(previous_path, "previous manifest")
                  previous_resources = previous.get("resources")
                  require(isinstance(previous_resources, dict), "previous resources must be an object")
                  previous_resource = previous["resources"]["krdict"]
                  require(isinstance(previous_resource, dict), "previous krdict resource must be an object")
                  previous_version = previous_resource.get("version")
                  previous_checksum = previous_resource.get("checksum")
                  require(isinstance(previous_version, str), "previous resource_version must be a string")
                  require(isinstance(previous_checksum, str), "previous checksum must be a string")
                  if resource_version == previous_version:
                      require(resource["checksum"] == previous_checksum, "candidate resource_version matches previous but checksum changed")
          except (KeyError, OSError, TypeError, ValueError) as error:
              print(f"resource validation failed: {error}", file=sys.stderr)
              raise SystemExit(1)
          PY

          for asset in \
              release-output/hanly-desktop-windows.zip \
              release-output/hanly-desktop-macos.tar.gz \
              release-output/hanly-desktop-linux.tar.gz \
              "release-output/$RESOURCE_ASSET_NAME" \
              release-output/hanly-resources.json; do
            (cd "$(dirname "$asset")" && sha256sum "$(basename "$asset")")
          done > release-output/SHA256SUMS

      # A dry run stops exactly here. Every check above has run against the real
      # draft, and nothing has been written to it: no asset was uploaded or
      # replaced, in this job or in the staging job.
      - name: Report a validated dry run
        if: ${{ inputs.validate_only == true }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "## Dry run" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- validated the $RELEASE_TAG draft; wrote no asset and published nothing" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the approved release
        id: publish
        if: ${{ inputs.validate_only != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          RESOURCE_ASSET_NAME: ${{ steps.resources.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          expected_assets=(
            hanly-desktop-windows.zip
            hanly-desktop-macos.tar.gz
            hanly-desktop-linux.tar.gz
            "$RESOURCE_ASSET_NAME"
            hanly-resources.json
            SHA256SUMS
          )
          for asset in "${expected_assets[@]}"; do
            [[ -f "release-output/$asset" ]] || {
              echo "missing staged release asset $asset" >&2
              exit 1
            }
          done

          gh release upload "$RELEASE_TAG" "${expected_assets[@]/#/release-output/}" --clobber

          actual_assets_file="$RUNNER_TEMP/actual-release-assets"
          gh api "repos/$REPOSITORY/releases/$RELEASE_ID" --jq '.assets[].name' | sort > "$actual_assets_file"
          mapfile -t actual_assets < "$actual_assets_file"
          if [[ ${#actual_assets[@]} -ne 6 ]]; then
            echo "partial draft: expected exactly six release assets" >&2
            exit 1
          fi
          mapfile -t sorted_expected < <(printf '%s\n' "${expected_assets[@]}" | sort)
          [[ "$(printf '%s\n' "${actual_assets[@]}")" == "$(printf '%s\n' "${sorted_expected[@]}")" ]] || {
            echo "partial draft: release asset list is not exactly the expected six" >&2
            exit 1
          }

          mkdir -p "$RUNNER_TEMP/published"
          gh release download "$RELEASE_TAG" --pattern SHA256SUMS \
            --dir "$RUNNER_TEMP/published" --clobber
          cmp --silent "$RUNNER_TEMP/published/SHA256SUMS" release-output/SHA256SUMS || {
            echo "the published SHA256SUMS is not the one generated for these assets" >&2
            exit 1
          }

          gh release edit "$RELEASE_TAG" --draft=false
