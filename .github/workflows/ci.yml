name: CI

# `quality` proves the portable Python contracts without desktop dependencies;
# `desktop` checks the React workspace; `native` exercises Python and Rust
# platform adapters on the systems that can run them. The frozen product is
# `build.yml`'s, and neither of these rebuilds it.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    name: desktop (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop
      - name: Check TypeScript
        run: npm run --prefix apps/desktop check
      - name: Run desktop bridge tests
        run: npm test --prefix apps/desktop
      - name: Run React page tests
        run: npm run --prefix apps/desktop test:ui
      - name: Build the production frontend
        run: npm run --prefix apps/desktop build

  quality:
    name: quality (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
      - name: Install packages
        run: |
          python -m pip install --editable packages/hanly
          python -m pip install --editable packages/hanly-app
      # Without the runtime extra, so a portable test that quietly needs the
      # desktop runtime or OCR stack fails here instead of passing locally.
      - name: Run the portable tests
        run: python -m pytest --suite portable
      - name: Run lint
        run: python -m ruff check packages packaging tests tools lab
      - name: Run type checks
        run: python -m mypy packages packaging tests tools lab

  native:
    name: native (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-latest
          - platform: linux
            runner: ubuntu-latest
    env:
      # Every capability these cases need is installed below, so a missing one
      # is a defect in this job rather than a reason to pass without running.
      HANLY_REQUIRE_NATIVE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Select the CI Python for Rust service fixtures
        run: python -c "import os,sys; open(os.environ['GITHUB_ENV'],'a').write('HANLY_TEST_PYTHON='+sys.executable+chr(10))"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Set up Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
          rustup default 1.99.0

      # Tauri's Linux runtime links WebKitGTK and Ayatana AppIndicator.
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          packages=(
            build-essential curl file libssl-dev libxdo-dev librsvg2-dev
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
            libegl1 libgl1 libfontconfig1 libx11-6 libxext6
            fonts-noto-cjk python3-tk xvfb
          )
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends "${packages[@]}"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev

      - name: Install CPU-only OCR runtime on Linux
        if: matrix.platform == 'linux'
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install packages with the desktop runtime
        run: |
          python -m pip install --editable packages/hanly
          python -m pip install --editable "packages/hanly-app[runtime]"

      # Rust integration tests start the actual Python service, so install it first.
      - name: Check Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

      - name: Test the native shell
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

      - name: Lint the native shell
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      # The real lookup child reads both, and neither is in the repository.
      # Building the dictionary here keeps the run off the release channel.
      - name: Prepare the EasyOCR weights
        run: python tools/prepare_easyocr_models.py

      - name: Build the dictionary the native lookup reads
        run: python tools/build_smoke_krdict.py data/generated/krdict.sqlite3

      - name: Run the native tests
        shell: bash
        run: |
          display=""
          if [ "${{ matrix.platform }}" = "linux" ]; then display="xvfb-run -a"; fi
          $display python -m pytest --suite native
