[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hanly-app"
version = "0.0.0"
description = "Hanly desktop application"
readme = {text = "Hanly desktop application package.", content-type = "text/plain"}
requires-python = ">=3.10"
dependencies = ["hanly==0.0.0"]

[project.optional-dependencies]
runtime = [
    "hanly[concrete]==0.0.0",
    "mss>=10.2,<11",
    "pynput>=1.8,<2",
    "PyQt6>=6.7,<7",
    "pywebview[qt6]>=6.2,<7",
]
dev = [
    "hanly-app[runtime]",
    "Pillow>=10,<13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hanly_app = ["assets/control_center/*.html", "assets/control_center/*.css", "assets/control_center/*.js"]
