[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hanly-app"
version = "1.1.0"
description = "Hanly desktop application"
readme = {text = "Hanly desktop application package.", content-type = "text/plain"}
requires-python = ">=3.10"
dependencies = ["certifi>=2024.2.2", "hanly==1.1.0", "zstandard>=0.23,<1"]

[project.scripts]
hanly = "hanly_app.cli:main"

[project.optional-dependencies]
runtime = [
    "hanly[concrete]==1.1.0",
    "mss>=10.2,<11",
    "Pillow>=10,<13",
    "pynput>=1.8,<2",
    # Apple Vision, the default recognizer on macOS, is reached through these;
    # keep them explicit so service imports do not depend on incidental extras.
    "pyobjc-core>=10,<13; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10,<13; sys_platform == 'darwin'",
]
dev = [
    "hanly-app[runtime]",
    "psutil>=5.9,<8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hanly_app = [
    "assets/hanly-build.json",
]
