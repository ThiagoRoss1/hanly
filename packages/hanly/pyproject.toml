[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hanly"
version = "0.1.0"
description = "Korean text analysis and dictionary engine for OCR and language-learning applications"
readme = {text = "Hanly engine package.", content-type = "text/plain"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
paddle = [
    "numpy>=1.24,<3",
    "paddleocr>=3.7,<4",
    "paddlepaddle>=3.3,<4",
]
kiwi = ["kiwipiepy>=0.23.2,<0.24"]
concrete = [
    "hanly[paddle]",
    "hanly[kiwi]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hanly = ["py.typed"]
