[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hanly"
version = "0.1.0"
description = "Korean text analysis and dictionary engine for OCR and language-learning applications"
readme = {text = "Hanly engine package.", content-type = "text/plain"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
easyocr = [
    "numpy>=1.24,<3",
    "easyocr>=1.7,<2",
]
kiwi = ["kiwipiepy>=0.23.2,<0.24"]
concrete = [
    "hanly[easyocr]",
    "hanly[kiwi]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hanly = ["py.typed"]
